[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/LunarLumos/LunarZero"
rust-version = "1.85"

[workspace.dependencies]
lz-schema = { path = "crates/lz-schema" }
lz-core = { path = "crates/lz-core" }
lz-tui = { path = "crates/lz-tui" }
lz-web = { path = "crates/lz-web" }

# async
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"

# serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order"] }
jsonc-parser = { version = "0.26", features = ["serde"] }
serde_yaml_ng = "0.10"

# storage
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# http
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "gzip"] }
bytes = "1"

# cli
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
inquire = "0.7"

# tui
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ropey = "1.6"
unicode-width = "0.2"
unicode-segmentation = "1"
textwrap = "0.16"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
similar = { version = "2", features = ["text", "inline"] }
nucleo-matcher = "0.3"
arboard = "3"
include_dir = "0.7"

# files / search
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
shell-words = "1"
rmcp = { version = "3", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
libc = "0.2"

# misc
etcetera = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
thiserror = "2"
anyhow = "1"
arc-swap = "1"
dashmap = "6"
strum = { version = "0.27", features = ["derive"] }
regex = "1"
rand = "0.9"
sha2 = "0.10"
sha1 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
infer = "0.16"
htmd = "0.2"
scraper = "0.23"
jiff = { version = "0.2", features = ["serde"] }
semver = "1"
flate2 = "1"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 1
